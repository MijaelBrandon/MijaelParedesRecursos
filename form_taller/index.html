<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inscripción Talleres</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>Inscripción a Talleres</h1>
  <p class="subtitle">Selecciona el taller y completa tus datos</p>

  <form id="formTaller">

    <div class="field">
      <label>Nombre del estudiante</label>
      <input type="text" id="nombre">
      <small class="error"></small>
    </div>

    <div class="field">
      <label>Grado</label>
      <select id="grado">
        <option value="">Seleccione grado</option>
        <option>1°</option>
        <option>2°</option>
        <option>3°</option>
        <option>4°</option>
        <option>5°</option>
      </select>
      <small class="error"></small>
    </div>

    <div class="field">
      <label>Taller</label>
      <select id="taller">
        <option value="">Seleccione taller</option>
        <option>Robótica</option>
        <option>Arte</option>
        <option>Música</option>
        <option>Programación</option>
      </select>
      <small class="error"></small>
    </div>

    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="email">
      <small class="error"></small>
    </div>

    <button type="submit">Inscribirse</button>

  </form>

  <p id="success" class="success"></p>
</div>

<script src="script.js"></script>
</body>
</html>
